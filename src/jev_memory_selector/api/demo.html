<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jev-memory-selector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0 auto;
      max-width: 820px;
      padding: 40px 20px 72px;
      font: 15px/1.5 Inter, "Segoe UI", Arial, sans-serif;
      background: #0e0f12;
      color: #e8e6e1;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    header { margin-bottom: 28px; }
    h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }
    .byline { color: #9a958c; font-size: 14px; margin: 0; }
    .stack { color: #9a958c; font-size: 13px; margin: 10px 0 0; }
    label {
      display: block;
      font-size: 12px;
      color: #9a958c;
      margin: 18px 0 6px;
    }
    textarea, input {
      width: 100%;
      box-sizing: border-box;
      background: #17181c;
      color: #e8e6e1;
      border: 1px solid #2a2c33;
      border-radius: 6px;
      padding: 10px 12px;
      font: 14px/1.45 Inter, "Segoe UI", Arial, sans-serif;
    }
    textarea { min-height: 148px; resize: vertical; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      margin-top: 18px;
      background: #e8e6e1;
      color: #111;
      border: 0;
      border-radius: 6px;
      padding: 9px 14px;
      font: 14px Inter, "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    .card {
      margin-top: 22px;
      border-top: 1px solid #2a2c33;
      padding-top: 16px;
    }
    .card h2 {
      font-size: 12px;
      margin: 0 0 10px;
      color: #9a958c;
    }
    .ok, .drop { margin: 12px 0; }
    .ok { padding-left: 10px; border-left: 2px solid #6faf7a; }
    .drop { padding-left: 10px; border-left: 2px solid #b0893a; color: #c4c0b6; }
    .meta { color: #9a958c; font-size: 12px; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 13px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>jev-memory-selector</h1>
    <p class="byline">Pinuts. Démo locale, sans clé.</p>
    <p class="stack">Python · HTTP · MCP · Docker · HTML</p>
  </header>
  <label for="query">Requête</label>
  <input id="query" value="Comment est configuré mon projet actuel ?">
  <div class="grid">
    <div>
      <label for="budget">Budget tokens</label>
      <input id="budget" type="number" min="1" value="40">
    </div>
    <div>
      <label for="max">Max souvenirs</label>
      <input id="max" type="number" min="1" value="5">
    </div>
  </div>
  <label for="memories">Souvenirs (un par ligne, id | texte)</label>
  <textarea id="memories">m1 | Le projet utilise React.
m2 | Le projet utilise React avec TypeScript.
m3 | Le projet actuel utilise Next.js.
m4 | Le projet précédent utilisait React.
m5 | Le serveur tourne sous Debian.</textarea>
  <button id="run" type="button">Lancer la sélection</button>
  <div id="out"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    async function run() {
      const button = $("run");
      button.disabled = true;
      $("out").innerHTML = "<p class='meta'>Calcul…</p>";
      const memories = $("memories").value.split("\n").map((line) => {
        const [id, ...rest] = line.split("|");
        return { id: id.trim(), content: rest.join("|").trim() };
      }).filter((row) => row.id && row.content);
      try {
        const response = await fetch("/v1/select", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query: $("query").value,
            memories,
            max_tokens: Number($("budget").value),
            max_memories: Number($("max").value),
          }),
        });
        const data = await response.json();
        if (!response.ok) {
          $("out").innerHTML = `<div class="card"><pre>${escapeHtml(data.error || JSON.stringify(data))}</pre></div>`;
          return;
        }
        const selected = (data.selected || []).map((item) => `
          <div class="ok">
            <strong>${escapeHtml(item.id)}</strong>
            <div>${escapeHtml(item.content)}</div>
            <div class="meta">${item.score} · ${item.tokens} tokens · ${(item.reasons || []).join(" · ")}</div>
          </div>`).join("") || "<p class='meta'>Rien de retenu.</p>";
        const dropped = (data.dropped || []).map((item) => `
          <div class="drop"><strong>${escapeHtml(item.id)}</strong> · ${escapeHtml(item.reason)}</div>
        `).join("") || "<p class='meta'>Aucun rejet.</p>";
        $("out").innerHTML = `
          <div class="card"><h2>Gardés · ${data.total_tokens} tokens</h2>${selected}</div>
          <div class="card"><h2>Laissés de côté</h2>${dropped}</div>`;
      } catch (err) {
        $("out").innerHTML = `<div class="card"><pre>${escapeHtml(String(err))}</pre></div>`;
      } finally {
        button.disabled = false;
      }
    }
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }
    $("run").addEventListener("click", run);
    run();
  </script>
</body>
</html>
