name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src tests examples
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python examples/basic.py
      - run: uv run --no-sync jev-memory demo
      - run: uv build
