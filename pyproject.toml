[project]
name = "jev-memory-selector"
version = "0.1.0"
description = "Sélection de mémoire pertinente sous budget de tokens pour agents IA (prototype heuristique déterministe)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mathieu Rossignol" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_memory_selector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
