[project]
name = "jev-memory-selector"
version = "0.2.0"
description = "Sélection de mémoire sous budget de tokens : heuristique locale ou JEV + gateway OpenAI-compatible."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pinuts" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Private :: Do Not Upload",
]

[project.scripts]
jev-memory = "jev_memory_selector.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_memory_selector"]

[tool.hatch.build.targets.wheel.force-include]
"src/jev_memory_selector/api/demo.html" = "jev_memory_selector/api/demo.html"
"src/jev_memory_selector/api/preview.html" = "jev_memory_selector/api/preview.html"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
